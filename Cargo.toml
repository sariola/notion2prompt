[workspace]
members = [".", "crates/notion2prompt-python"]

[package]
name = "notion2prompt"
version = "0.1.1"
edition = "2021"
authors = ["notion2prompt contributors"]
description = "A Rust CLI tool that converts Notion pages and databases into structured prompts for AI models"
license = "MIT"
repository = "https://github.com/sariola/notion2prompt"
homepage = "https://github.com/sariola/notion2prompt"
documentation = "https://docs.rs/notion2prompt"
readme = "README.md"
keywords = ["notion", "cli", "ai", "prompt", "markdown"]
categories = ["command-line-utilities", "text-processing"]
exclude = [
    "test_*.md",
    "*_test.md", 
    "comprehensive_test.md",
    "full_output.md",
    "new_output*.md",
    "toc_test.md",
    ".env",
    "notion_content.txt",
    "notion_context"
]

[features]
bench = []

[lib]
name = "notion2prompt"
path = "src/lib.rs"

[[bin]]
name = "notion2prompt"
path = "src/main.rs"

[dependencies]
regex = "1.13.1"
clap = { version = "4.6.7", features = ["derive"] }
log = "0.4.34"
log4rs = "1.4.0"
anyhow = "1.0.104"
serde_json = "1.0.151"
chrono = { version = "0.4.45", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.53", features = ["full"] }
url = "2.5.8"
thiserror = "2.0.21"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "blocking", "rustls", "http2"] }
handlebars = "6.4.4"
arboard = { version = "3.6.1", features = ["wayland-data-control"] }
diff = "0.1.13"
uuid = { version = "1.28.0", features = ["v4"] }
lazy_static = "1.5.1"
futures = "0.3.34"
rand = "0.10.3"
indexmap = { version = "2.14.2", features = ["serde"] }
pathdiff = "0.2.3"
once_cell = "1.21.4"
crossbeam = "0.8.5"
num_cpus = "1.17.0"
im = "15.1.0"
im-rc = "15.1.0"
rayon = "1.12.0"
async-trait = "0.1.92"
dashmap = "6.2.1"
memmap2 = "0.9.11"
parking_lot = "0.12.5"
lru = "0.18.5"
# 1.1 speaks Notion API 2026-03-11 (in_trash, data sources). This crate still
# requests Notion-Version 2022-06-28, so stay on the latest 1.0 release.
notion-client = "~1.0.12"

[dev-dependencies]
pretty_assertions = "1.4"
criterion = { version = "0.8", features = ["html_reports"] }
insta = { version = "1.49", features = ["glob"] }

[[bench]]
name = "formatting_bench"
harness = false
required-features = ["bench"]

[[bench]]
name = "api_bench"
harness = false
required-features = ["bench"]
